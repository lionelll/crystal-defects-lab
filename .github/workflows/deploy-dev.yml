name: Deploy dev to defects test

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crystal-defects-lab-dev
  cancel-in-progress: true

jobs:
  build-deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_ROOT: /var/www/defects-dev
      TEST_ORIGIN: http://123.57.11.145:8080
      DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
      DEV_SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
      DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}

    steps:
      - name: Check out exact dev commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test and typecheck
        run: |
          npm test
          npx tsc --noEmit

      - name: Build /defects/ assets
        run: |
          npm run build
          grep -F '/defects/logo.png' dist/index.html
          grep -F '/defects/assets/' dist/index.html

      - name: Write test version and file hashes
        shell: bash
        run: |
          set -euo pipefail
          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"version":"dev","commit":"%s","environment":"test","basePath":"/defects/","deployedAt":"%s"}\n' \
            "$GITHUB_SHA" "$deployed_at" > dist/release.json
          (cd dist && find . -type f ! -name files.sha256 -print0 | sort -z | xargs -0 sha256sum > files.sha256)

      - name: Confirm public path does not fall back to the portal
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --max-time 10 "$TEST_ORIGIN/defects/release.json" || true)"
          if grep -Fq '材料科学可视化工具集' <<< "$response"; then
            echo 'The /defects/ mapping still falls back to the portal; deployment stopped.' >&2
            exit 1
          fi

      - name: Configure isolated pinned SSH access
        shell: bash
        env:
          DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$DEV_SSH_HOST" = 123.57.11.145
          test "$DEV_SSH_PORT" = 22
          test "$DEV_SSH_USER" = defects-deploy
          test -n "$DEV_SSH_PRIVATE_KEY"
          test -n "$DEV_SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEV_SSH_PRIVATE_KEY" > "$HOME/.ssh/defects_ed25519"
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > "$HOME/.ssh/defects_known_hosts"
          ssh-keygen -F "$DEV_SSH_HOST" -f "$HOME/.ssh/defects_known_hosts" \
            | grep -Fq 'ssh-ed25519 '
          cat > "$HOME/.ssh/defects_config" <<EOF
          Host defects-test
            HostName $DEV_SSH_HOST
            Port $DEV_SSH_PORT
            User $DEV_SSH_USER
            IdentityFile $HOME/.ssh/defects_ed25519
            UserKnownHostsFile $HOME/.ssh/defects_known_hosts
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$HOME/.ssh/defects_ed25519" "$HOME/.ssh/defects_known_hosts" "$HOME/.ssh/defects_config"

      - name: Check project-only remote directory
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          next_link="current.next.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          ssh -F "$HOME/.ssh/defects_config" defects-test \
            "set -eu; test -d '$DEPLOY_ROOT'; test \"\$(realpath -e '$DEPLOY_ROOT')\" = '$DEPLOY_ROOT'; test -w '$DEPLOY_ROOT'; test -d '$DEPLOY_ROOT/releases'; test -w '$DEPLOY_ROOT/releases'; test ! -e '$DEPLOY_ROOT/$next_link'; test ! -L '$DEPLOY_ROOT/$next_link'"

      - name: Upload and verify immutable release
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$DEPLOY_ROOT/releases/$GITHUB_SHA"
          release_state="$(ssh -F "$HOME/.ssh/defects_config" defects-test \
            "set -eu; if test -L '$release_dir'; then exit 1; elif test -d '$release_dir'; then printf existing; elif test -e '$release_dir'; then exit 1; else printf new; fi")"
          if [[ "$release_state" == new ]]; then
            ssh -F "$HOME/.ssh/defects_config" defects-test "mkdir '$release_dir'"
            rsync -az -e "ssh -F $HOME/.ssh/defects_config" \
              dist/ "defects-test:$release_dir/"
          else
            test "$release_state" = existing
          fi
          ssh -F "$HOME/.ssh/defects_config" defects-test \
            "cd '$release_dir' && sha256sum -c files.sha256"
          remote_release="$(ssh -F "$HOME/.ssh/defects_config" defects-test \
            "cat '$release_dir/release.json'")"
          printf '%s' "$remote_release" | python3 -c \
            'import json,sys; d=json.load(sys.stdin); assert d["commit"] == sys.argv[1] and d["version"] == "dev" and d["environment"] == "test" and d["basePath"] == "/defects/"' \
            "$GITHUB_SHA"
          if [[ "$release_state" == existing ]]; then
            local_static="$(cd dist && find . -type f ! -name release.json ! -name files.sha256 -print0 | sort -z | xargs -0 sha256sum)"
            remote_static="$(ssh -F "$HOME/.ssh/defects_config" defects-test \
              "cd '$release_dir' && find . -type f ! -name release.json ! -name files.sha256 -print0 | sort -z | xargs -0 sha256sum")"
            test "$local_static" = "$remote_static"
          fi

      - name: Activate and verify without automatic rollback
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          next_link="current.next.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          previous="$(ssh -F "$HOME/.ssh/defects_config" defects-test \
            "set -eu; if test -L '$DEPLOY_ROOT/current'; then readlink '$DEPLOY_ROOT/current'; elif test -e '$DEPLOY_ROOT/current'; then exit 1; fi")"
          if [[ -n "$previous" && ! "$previous" =~ ^releases/[0-9a-f]{40}$ ]]; then
            echo 'Current version pointer is outside the expected project release format.' >&2
            exit 1
          fi
          printf 'Previous current: %s\n' "${previous:-none}" >> "$GITHUB_STEP_SUMMARY"
          remote_head="$(git ls-remote origin refs/heads/dev | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

          if ! ssh -F "$HOME/.ssh/defects_config" defects-test \
            "set -eu; cd '$DEPLOY_ROOT'; ln -s 'releases/$GITHUB_SHA' '$next_link'; mv -Tf '$next_link' current; test \"\$(readlink current)\" = 'releases/$GITHUB_SHA'"; then
            observed="$(ssh -F "$HOME/.ssh/defects_config" defects-test \
              "readlink '$DEPLOY_ROOT/current' || true" || true)"
            echo "::error::Activation failed; current=${observed:-unknown}. No automatic rollback."
            exit 1
          fi

          verify_public() {
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              "$TEST_ORIGIN/defects/release.json" | python3 -c \
              'import json,sys; d=json.load(sys.stdin); assert d["commit"] == sys.argv[1] and d["version"] == "dev" and d["environment"] == "test" and d["basePath"] == "/defects/"' \
              "$GITHUB_SHA" || return 1
            curl --fail --silent --show-error "$TEST_ORIGIN/defects/" \
              | grep -F '位错 3D 动态交互实验室' || return 1
            curl --fail --silent --show-error "$TEST_ORIGIN/defects/scene/edge-glide" \
              | grep -F '位错 3D 动态交互实验室' || return 1
            curl --fail --silent --show-error --head "$TEST_ORIGIN/defects/logo.png" \
              | grep -qi 'content-type: image/png' || return 1
            for asset in dist/assets/*; do
              curl --fail --silent --show-error --output /dev/null \
                "$TEST_ORIGIN/defects/assets/${asset##*/}" || return 1
            done
          }
          if ! verify_public; then
            observed="$(ssh -F "$HOME/.ssh/defects_config" defects-test \
              "readlink '$DEPLOY_ROOT/current' || true" || true)"
            echo "::error::Public verification failed; current=${observed:-unknown}. Manual recovery requires authorization."
            exit 1
          fi
          switched_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if ! ssh -F "$HOME/.ssh/defects_config" defects-test \
            "printf '%s %s %s\\n' '$switched_at' '${previous:-none}' '$GITHUB_SHA' >> '$DEPLOY_ROOT/deployments.log'"; then
            echo "::error::Project log write failed after switch; current may be $GITHUB_SHA. No automatic rollback."
            exit 1
          fi
          printf 'Deployed %s at %s to %s/defects/\n' "$GITHUB_SHA" "$switched_at" "$TEST_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
